<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>افزودن محصول</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <section class="admin-page">

        <div class="admin-box">

            <div class="admin-header">

                <a href="index.html">

                    <i class="fa-solid fa-arrow-right"></i>

                    بازگشت به فروشگاه

                </a>

                <h1>

                    <i class="fa-solid fa-box icon-red"></i>

                    افزودن محصول جدید

                </h1>

            </div>


            <form id="product-form">


                <!-- نام محصول -->

                <label for="title">

                    <i class="fa-solid fa-tag"></i>

                    نام محصول

                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="مثلاً هدفون بلوتوثی"
                    required
                >


                <!-- قیمت -->

                <label for="price">

                    <i class="fa-solid fa-money-bill"></i>

                    قیمت (تومان)

                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="مثلاً 1500000"
                    min="0"
                    required
                >


                <!-- موجودی -->

                <label for="stock">

                    <i class="fa-solid fa-boxes-stacked"></i>

                    تعداد موجودی

                </label>

                <input
                    type="number"
                    id="stock"
                    placeholder="مثلاً 20"
                    min="0"
                    required
                >


                <!-- توضیحات -->

                <label for="description">

                    <i class="fa-solid fa-align-right"></i>

                    توضیحات محصول

                </label>

                <textarea
                    id="description"
                    placeholder="توضیحات کامل محصول..."
                ></textarea>


                <!-- تصاویر -->

                <label for="images">

                    <i class="fa-solid fa-images"></i>

                    تصاویر محصول

                </label>

                <input
                    type="file"
                    id="images"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    required
                >

                <p class="help-text">

                    می‌توانید چند تصویر انتخاب کنید.

                </p>


                <!-- پیش‌نمایش تصاویر -->

                <div
                    id="image-preview"
                    class="image-preview"
                ></div>


                <!-- ثبت -->

                <button
                    type="submit"
                    id="submit-button"
                >

                    <i class="fa-solid fa-plus"></i>

                    ثبت محصول

                </button>


                <!-- پیام -->

                <p id="message"></p>


            </form>

        </div>


        <!-- کنسول سایت -->

        <div id="site-console">

            <div class="console-header">

                <span>

                    <i class="fa-solid fa-terminal"></i>

                    کنسول سیستم

                </span>


                <button
                    type="button"
                    id="clear-console"
                >

                    پاک کردن

                </button>

            </div>


            <div id="console-output"></div>

        </div>

    </section>


    <script src="add-product.js"></script>

</body>

</html>
